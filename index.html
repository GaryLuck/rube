<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build and run your own Rube Goldberg machines in the browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e4572e'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23fff' opacity='.6'/%3E%3C/svg%3E" />
    <title>Rube Workshop</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="#e4572e" /><circle cx="12" cy="12" r="4" fill="#fff" opacity=".55" /></svg>
        <span>Rube Workshop</span>
      </div>
      <input id="machine-name" class="name-input" aria-label="Machine name" maxlength="80" />
      <div class="group run-group">
        <button id="run-btn" class="primary" title="Run the machine (Space)">▶ Run</button>
        <button id="reset-btn" title="Back to the editor (Esc)" disabled>↺ Reset</button>
        <label class="speed" title="Simulation speed">
          <span class="sr-only">Speed</span>
          <select id="speed">
            <option value="0.25">¼×</option>
            <option value="0.5">½×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select>
        </label>
      </div>
      <div class="group file-group">
        <select id="samples" aria-label="Load a sample machine">
          <option value="">Samples…</option>
        </select>
        <button id="new-btn" title="Start an empty machine">New</button>
        <button id="save-btn" title="Save to this browser">Save</button>
        <button id="open-btn" title="Open a machine saved in this browser">Open</button>
        <button id="export-btn" title="Download as a .json file">Export</button>
        <button id="import-btn" title="Load a .json file">Import</button>
        <button id="share-btn" title="Copy a link to this machine">Share</button>
        <button id="mute-btn" title="Toggle sound" aria-pressed="false">🔊</button>
      </div>
    </header>

    <main class="layout">
      <aside class="palette" aria-label="Parts">
        <div id="palette"></div>
      </aside>

      <section class="stage-wrap">
        <div class="edit-tools">
          <button id="undo-btn" title="Undo (Ctrl+Z)">↶ Undo</button>
          <button id="redo-btn" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
          <label class="check"><input type="checkbox" id="snap" checked /> Snap to grid</label>
          <span id="part-count" class="muted"></span>
        </div>
        <div class="stage" id="stage">
          <canvas id="canvas"></canvas>
          <div class="hud" id="hud" hidden></div>
          <div class="banner" id="banner" hidden></div>
        </div>
        <p class="status" id="status"></p>
      </section>

      <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
    </main>

    <dialog id="machines-dialog">
      <form method="dialog">
        <h2>My machines</h2>
        <ul id="machines-list"></ul>
        <menu><button value="close">Close</button></menu>
      </form>
    </dialog>
    <input type="file" id="file-input" accept="application/json,.json" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
